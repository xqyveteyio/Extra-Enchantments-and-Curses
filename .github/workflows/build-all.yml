name: Build all versions

# Manual only. Builds every version branch in one go and uploads one artifact per branch.
on:
  workflow_dispatch:

jobs:
  discover:
    name: Find version branches
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.list.outputs.branches }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Each supported Minecraft version lives on its own <version>-fabric branch, so new ones
      # are picked up here without anyone editing this file.
      - name: List branches
        id: list
        run: |
          branches=$(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/*-fabric' \
            | sed 's|^origin/||' | sort -V | jq -R . | jq -sc .)
          echo "Found: $branches"
          echo "branches=$branches" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.branch }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      # One branch failing should not cancel the others.
      fail-fast: false
      matrix:
        branch: ${{ fromJson(needs.discover.outputs.branches) }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}

      - name: Detect Java version
        id: java
        run: |
          version=$(grep -oP 'options\.release\s*=\s*\K\d+' build.gradle)
          echo "Building with Java $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.branch }}
          path: build/libs/*.jar
          if-no-files-found: error
