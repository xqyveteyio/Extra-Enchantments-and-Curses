name: Build

# Manual only. Pick the version branch to build from the "Run workflow" dropdown.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ github.ref_name }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Every version branch targets a different Java release, so read it out of the build script
      # rather than hardcoding it. That keeps this file identical on all branches.
      - name: Detect Java version
        id: java
        run: |
          version=$(grep -oP 'options\.release\s*=\s*\K\d+' build.gradle)
          echo "Building with Java $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.ref_name }}
          path: build/libs/*.jar
          if-no-files-found: error
