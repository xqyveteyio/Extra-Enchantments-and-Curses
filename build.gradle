plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.wispforest.io' }
    // owo-lib pulls kdl4j, which is only published through JitPack.
    maven { url = 'https://jitpack.io' }
}

dependencies {
    // To change the versions see the gradle.properties file
    // No mappings dependency: Minecraft ships unobfuscated since 26.1, so its own names are final.
    // For the same reason Loom no longer remaps dependencies, and the modImplementation
    // configuration it used to add is gone — mod dependencies are plain implementation ones now.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Other dependencies
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    annotationProcessor implementation("io.wispforest:owo-lib:${project.owo_version}")
    include "io.wispforest:owo-sentinel:${project.owo_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    // 26.x refuses to start on anything below Java 25. Declared as a toolchain so the build works
    // regardless of which JDK Gradle itself happens to be running on.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }

    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}

// configure the maven publication
publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
}
