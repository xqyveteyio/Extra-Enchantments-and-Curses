# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G

# IntelliJ IDEA is not yet fully compatible with configuration cache, see:
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
# Since 26.1 Minecraft ships unobfuscated, so there is no yarn_mappings entry any more.
minecraft_version=26.1.2
loader_version=0.19.5
loom_version=1.17.20

# Mod Properties
mod_version=1.11.0
maven_group=net.js03
archives_base_name=Extra-Enchantments-and-Curses

# Dependencies
# One Fabric API build covers the whole 26.1 drop, hotfixes included.
fabric_version=0.155.2+26.1.2
# https://maven.wispforest.io/io/wispforest/owo-lib/
owo_version=0.13.1+26.1
